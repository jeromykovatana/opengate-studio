name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  clean-room-and-python:
    name: Clean-Room & Python Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify clean-room policy and SHA-256 pins
        run: |
          python3 scripts/verify_clean_room.py
          python3 cli/studio_cli.py verify-pins --json

      - name: Run clip checker self-test
        run: python3 cli/bionz_clip_check.py --selftest

      - name: Run Python unit & integration tests
        run: python3 -B -m unittest discover -s tests -v

  macos-swift-tests:
    name: macOS SwiftUI & Core Tests
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Swift package tests
        run: bash macos/OpenGateStudio/run_tests.sh
