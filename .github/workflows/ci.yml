name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  clean-room-and-python:
    name: Clean-Room & Python Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      - name: Verify clean-room policy, support matrix, and SHA-256 pins
        run: |
          python3 scripts/verify_clean_room.py
          python3 scripts/generate_support_matrix.py --check
          python3 cli/studio_cli.py verify-pins --json

      - name: Run clip checker self-test
        run: python3 cli/bionz_clip_check.py --selftest

      - name: Run Android runtime self-test and kit packager dry-run
        run: |
          python3 android/python/opengate_android/runtime.py --selftest --json
          python3 scripts/build_android_kit.py --dry-run --json

      - name: Install ffmpeg for proxy integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run Python unit & integration tests
        run: python3 -W error::ResourceWarning -B -m unittest discover -s tests -v

  reproducible-helper-build:
    name: Reproducible Helper SHA-256 Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-build.txt

      - name: Install hash-pinned Zig toolchain
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-build.txt

      - name: Rebuild all 90 helpers and verify SHA-256 pins
        run: python3 scripts/verify_reproducible_build.py --json

  macos-swift-tests:
    name: macOS SwiftUI & Core Tests
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install ffmpeg for proxy integration tests
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg
          fi

      - name: Run Swift package tests
        run: bash macos/OpenGateStudio/run_tests.sh

  android-companion-apk:
    name: Android Companion APK & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Build Android kit and run Gradle unit tests + debug APK
        run: |
          python3 scripts/build_android_kit.py --json
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
            ./android/gradlew -p android testDebugUnitTest assembleDebug
          else
            echo "android/gradlew not present yet; skipping Gradle build."
          fi

      - name: Upload Android debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
