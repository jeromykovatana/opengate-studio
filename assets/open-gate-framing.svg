<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">3:2 Open Gate Sensor Framing vs Stock 16:9</title>
  <desc id="desc">Comparison showing full 3840x2560 3:2 Open Gate sensor capture versus stock 3840x2160 16:9 crop and its workflow advantages.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e1a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gainBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.28"/>
    </linearGradient>
  </defs>

  <!-- Outer Card -->
  <rect x="1" y="1" width="1598" height="718" rx="22" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="64" y="68" font-size="34" font-weight="800" fill="#f8fafc">Why 3:2 Open Gate? Full IMX510 Sensor Height vs. Stock 16:9</text>
    <text x="64" y="102" font-size="18.5" font-weight="500" fill="#94a3b8">Capture the entire 3840×2560 sensor readout instead of discarding 400 vertical pixels before encoding.</text>
  </g>

  <!-- Left Panel: Proportional Geometry Diagram -->
  <g>
    <rect x="64" y="136" width="760" height="528" rx="16" fill="#060b16" stroke="#1e293b" stroke-width="1.5"/>
    <text x="92" y="174" font-family="'SF Mono', Menlo, Monaco, monospace" font-size="13.5" font-weight="700" letter-spacing="0.8" fill="#38bdf8">PROPORTIONAL SENSOR GEOMETRY (3:2 vs 16:9 vs 9:16)</text>

    <!-- Outer 3:2 Open Gate Rectangle: 600 x 400 at x=144, y=200 -->
    <rect x="144" y="200" width="600" height="400" fill="url(#gainBand)" stroke="#38bdf8" stroke-width="3"/>

    <!-- Inner Stock 16:9 Rectangle: 600 x 337.5 centered at y=231.25..568.75 -->
    <rect x="144" y="231.25" width="600" height="337.5" fill="#0b1120" fill-opacity="0.88" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="10 6"/>

    <!-- Inner 9:16 Vertical Social Delivery Guide: 225 x 400 centered horizontally at x=331.5, y=200 -->
    <rect x="331.5" y="200" width="225" height="400" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 5" stroke-opacity="0.85"/>

    <!-- Top & Bottom Gain Callouts (with clean opaque pill backdrop over 9:16 guide) -->
    <rect x="339" y="206" width="210" height="20" rx="5" fill="#091a30" fill-opacity="0.95"/>
    <text x="444" y="220" text-anchor="middle" font-family="'SF Mono', Menlo, Monaco, monospace" font-size="12" font-weight="700" fill="#bae6fd">+200 px TOP GAINED</text>

    <rect x="339" y="574" width="210" height="20" rx="5" fill="#091a30" fill-opacity="0.95"/>
    <text x="444" y="588" text-anchor="middle" font-family="'SF Mono', Menlo, Monaco, monospace" font-size="12" font-weight="700" fill="#bae6fd">+200 px BOTTOM GAINED</text>

    <!-- 9:16 Guide Label -->
    <rect x="369" y="534" width="150" height="24" rx="6" fill="#1e1b4b" fill-opacity="0.9" stroke="#a78bfa" stroke-opacity="0.6"/>
    <text x="444" y="550" text-anchor="middle" font-family="'SF Mono', Menlo, Monaco, monospace" font-size="11.5" font-weight="700" fill="#ddd6fe">9:16 VERTICAL CROP</text>

    <!-- Center Comparison Badge -->
    <rect x="274" y="328" width="340" height="128" rx="14" fill="#0f172a" fill-opacity="0.95" stroke="#334155" stroke-width="1.5"/>
    <text x="444" y="372" text-anchor="middle" font-family="'SF Mono', Menlo, Monaco, monospace" font-size="32" font-weight="800" fill="#f8fafc">3840 × 2560</text>
    <text x="444" y="402" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#38bdf8">3:2 Open Gate · 9.83 MP</text>
    <text x="444" y="432" text-anchor="middle" font-family="'SF Mono', Menlo, Monaco, monospace" font-size="14" font-weight="600" fill="#fbbf24">Stock 16:9: 3840 × 2160 (8.29 MP)</text>

    <!-- Left Panel Footer -->
    <text x="444" y="640" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#cbd5e1">+18.5% More Vertical Resolution · Ideal for Hybrid Delivery &amp; Anamorphic</text>
  </g>

  <!-- Right Panel: 3 Stacked Benefit Cards -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <!-- Card 1 -->
    <rect x="856" y="136" width="680" height="160" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="856" y="156" width="5" height="120" rx="2.5" fill="#38bdf8"/>
    <rect x="884" y="156" width="160" height="26" rx="6" fill="#0c4a6e" fill-opacity="0.75"/>
    <text x="964" y="173" text-anchor="middle" font-family="'SF Mono', Menlo, Monaco, monospace" font-size="12" font-weight="700" fill="#7dd3fc">01 · RE-FRAMING</text>
    <text x="884" y="212" font-size="22" font-weight="700" fill="#f8fafc">Shoot Once → Deliver 16:9 Cinema &amp; 9:16 Social</text>
    <text x="884" y="244" font-size="16" fill="#cbd5e1">Capture full 3:2 headroom and re-frame both widescreen 16:9 and vertical 9:16</text>
    <text x="884" y="268" font-size="16" fill="#cbd5e1">reels from the exact same take without throwing away sensor height.</text>

    <!-- Card 2 -->
    <rect x="856" y="320" width="680" height="160" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="856" y="340" width="5" height="120" rx="2.5" fill="#f59e0b"/>
    <rect x="884" y="340" width="236" height="26" rx="6" fill="#78350f" fill-opacity="0.75"/>
    <text x="1002" y="357" text-anchor="middle" font-family="'SF Mono', Menlo, Monaco, monospace" font-size="12" font-weight="700" fill="#fde68a">02 · ANAMORPHIC &amp; HDMI</text>
    <text x="884" y="396" font-size="22" font-weight="700" fill="#f8fafc">True De-Squeeze Preview &amp; Clean 3:2 HDMI</text>
    <text x="884" y="428" font-size="16" fill="#cbd5e1">Get uncropped 3:2 LCD/EVF framing with 1.33× / 1.5× / 1.6× / 2.0× preview cycles</text>
    <text x="884" y="452" font-size="16" fill="#cbd5e1">plus clean 3:2 pillarboxed &amp; anamorphic external monitor HDMI output.</text>

    <!-- Card 3 -->
    <rect x="856" y="504" width="680" height="160" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="856" y="524" width="5" height="120" rx="2.5" fill="#10b981"/>
    <rect x="884" y="524" width="236" height="26" rx="6" fill="#064e3b" fill-opacity="0.75"/>
    <text x="1002" y="541" text-anchor="middle" font-family="'SF Mono', Menlo, Monaco, monospace" font-size="12" font-weight="700" fill="#6ee7b7">03 · NATIVE MP4 + GYRO</text>
    <text x="884" y="580" font-size="22" font-weight="700" fill="#f8fafc">Native 3:2 MP4 Headers &amp; Gyro Telemetry Kept</text>
    <text x="884" y="612" font-size="16" fill="#cbd5e1">Fixes tkhd, stsd, VPRF &amp; NRT XML in-camera so DaVinci Resolve, Premiere,</text>
    <text x="884" y="636" font-size="16" fill="#cbd5e1">Gyroflow &amp; Catalyst Browse open 3:2 natively — no ffmpeg strip of rtmd gyro.</text>
  </g>
</svg>
